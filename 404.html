<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1114">
<title>DeadShop — page not found</title>
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<style>
  @font-face{
    font-family:'Saira';
    src:url('/assets/fonts/saira-var.woff2') format('woff2');
    font-weight:100 900; font-style:normal; font-display:swap;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:grid;place-items:center;padding:28px;
    background:
      radial-gradient(900px 420px at 50% -8%,rgba(61,220,200,.12),transparent 62%),
      radial-gradient(700px 380px at 90% 110%,rgba(245,165,36,.08),transparent 60%),
      #0C1114;
    color:#E7EEF1;font-family:'Saira',system-ui,-apple-system,sans-serif;font-weight:700;
  }
  .card{
    width:100%;max-width:460px;background:#151D22;border:2px solid #25333A;padding:32px 28px;
    clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),
      calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px);
    text-align:center;
  }
  .owl{width:120px;height:120px;object-fit:contain;margin:0 auto 6px}
  h1{font-size:30px;letter-spacing:2px;text-transform:uppercase;margin:0 0 6px}
  .code{font-size:13px;letter-spacing:3px;color:#3DDCC8;text-transform:uppercase;font-weight:800}
  p{color:#8DA0A9;font-size:14.5px;line-height:1.5;margin:12px 0 22px}
  a.btn{
    display:block;padding:14px 20px;border:0;border-radius:0;text-decoration:none;
    background:#58CC02;color:#fff;font-family:inherit;font-weight:800;font-size:15px;
    letter-spacing:.6px;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,
      100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  }
  a.ghost{background:#1C262C;color:#3DDCC8;margin-top:10px}
  .links{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .links a{color:#3DDCC8;font-size:13px;text-decoration:none;border-bottom:1px solid #25333A}
</style>
</head>
<body>
  <div class="card">
    <img class="owl" src="/assets/owl.svg" alt="Grey Talon's owl" width="120" height="120">
    <div class="code">404 · wrong shop</div>
    <h1>Nothing here</h1>
    <p>The owl checked every shelf and found nothing. That page does not exist —
      but the shop is still where you left it.</p>
    <a class="btn" href="/">BACK TO THE SHOP</a>
    <div class="links">
      <a href="/#daily">Daily run</a>
      <a href="/#items">Item browser</a>
      <a href="/#stats">Your progress</a>
    </div>
  </div>
</body>
</html>
