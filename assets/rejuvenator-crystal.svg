<?xml version="1.0" encoding="UTF-8"?>
<!-- The crystal of the Rejuvenator, drawn the way the game draws it.

     The game shows it in the pit of the Midboss: a tall dark shard of rock
     with a bright green light inside it, standing over a pool of light. The
     colours of this picture are the colours of that shard, taken from the
     render of the game itself:

         the light of the core     #75F15B
         the dark of the stone     #2E311E
         the grey of the faces     #414134
         the light of the edges    #83715A

     The shard is drawn as facets, so the light of the core has something to
     shine through, and the whole of it can be turned and broken. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A79C7E"/>
      <stop offset="0.45" stop-color="#6B6B52"/>
      <stop offset="1" stop-color="#3E4227"/>
    </linearGradient>
    <linearGradient id="faceLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6C9AC"/>
      <stop offset="1" stop-color="#7C7A60"/>
    </linearGradient>
    <linearGradient id="faceDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A5C3C"/>
      <stop offset="1" stop-color="#2A2D19"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#EAFFC8"/>
      <stop offset="0.35" stop-color="#9BFF6E"/>
      <stop offset="0.75" stop-color="#48C93A"/>
      <stop offset="1" stop-color="#1E6B22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6BEE55" stop-opacity="0.15"/>
      <stop offset="0.3" stop-color="#8BFF63" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#B6FF8A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3FA83A" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="shard">
      <path d="M100 6 L136 62 L152 128 L162 208 L150 268 L124 330 L100 392
               L78 332 L52 270 L38 210 L46 130 L62 62 Z"/>
    </clipPath>
  </defs>

  <!-- the light of the core, seen through the stone -->
  <g clip-path="url(#shard)">
    <ellipse cx="100" cy="262" rx="66" ry="98" fill="url(#core)" filter="url(#softer)" opacity="1"/>
    <path d="M78 150 L122 150 L112 300 L100 344 L88 300 Z" fill="url(#coreBar)" filter="url(#soft)"/>
    <ellipse cx="100" cy="268" rx="34" ry="54" fill="#E4FFC8" filter="url(#soft)" opacity="1"/>

    <!-- the facets of the stone -->
    <path d="M100 6 L136 62 L118 120 L78 128 L62 62 Z" fill="url(#rock)"/>
    <path d="M100 6 L118 120 L100 196 L84 118 Z" fill="#7C7E5C" opacity="0.9"/>
    <path d="M62 62 L78 128 L52 210 L46 130 Z" fill="url(#faceLight)" opacity="0.9"/>
    <path d="M118 120 L152 128 L162 208 L120 196 Z" fill="url(#faceDark)"/>
    <path d="M78 128 L118 120 L120 196 L84 196 Z" fill="#6E7050"/>
    <path d="M46 130 L84 196 L74 268 L52 270 L38 210 Z" fill="#55573A"/>
    <path d="M120 196 L162 208 L150 268 L124 330 L110 268 Z" fill="url(#faceDark)"/>
    <path d="M84 196 L120 196 L110 268 L92 300 L78 268 Z" fill="#57703A" opacity="0.95"/>
    <path d="M52 270 L74 268 L78 332 L100 392 L86 330 Z" fill="#3A3D24"/>
    <path d="M110 268 L150 268 L124 330 L100 392 L104 320 Z" fill="#33361C"/>

    <!-- the light along the left edge, the way the game lights the shard -->
    <path d="M100 6 L62 62 L46 130 L38 210 L52 270" fill="none"
          stroke="#EFE2C4" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M100 6 L136 62 L152 128" fill="none"
          stroke="#A8B878" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- the little chips of the core, the sparks that the game has around it -->
  <g fill="#B6FF8A">
    <circle cx="66" cy="258" r="2.1" opacity="0.8"/>
    <circle cx="134" cy="246" r="1.7" opacity="0.7"/>
    <circle cx="78" cy="300" r="1.5" opacity="0.6"/>
    <circle cx="124" cy="292" r="1.9" opacity="0.65"/>
    <circle cx="92" cy="212" r="1.3" opacity="0.55"/>
    <circle cx="112" cy="222" r="1.6" opacity="0.5"/>
  </g>
</svg>
