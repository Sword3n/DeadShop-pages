<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96" role="img" aria-label="Rejuvenator crystal">
  <defs>
    <!-- the light inside the stone -->
    <linearGradient id="rejCore" x1="0.5" y1="0.05" x2="0.5" y2="0.95">
      <stop offset="0" stop-color="#EAFFD0"/>
      <stop offset="0.28" stop-color="#A8F07A"/>
      <stop offset="0.62" stop-color="#4FCB45"/>
      <stop offset="1" stop-color="#1D7A32"/>
    </linearGradient>
    <!-- the stone around it -->
    <linearGradient id="rejStone" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3C4A48"/>
      <stop offset="0.45" stop-color="#26312F"/>
      <stop offset="1" stop-color="#121A19"/>
    </linearGradient>
    <radialGradient id="rejHalo" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#5FE05A" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#3FB950" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- the glow around the stone -->
  <ellipse cx="32" cy="58" rx="30" ry="42" fill="url(#rejHalo)"/>

  <!-- the outer stone: a broken shard, the way the crystal looks in the pit -->
  <path fill="url(#rejStone)" d="M32 2L47 22L51 52L42 84L32 94L21 84L13 52L17 22Z"/>
  <!-- the lit face on the left -->
  <path fill="#46554F" opacity="0.75" d="M32 2L17 22L13 52L21 84L32 94L27 58Z"/>
  <!-- the dark face on the right -->
  <path fill="#0D1413" opacity="0.85" d="M32 2L47 22L51 52L42 84L32 94L37 58Z"/>

  <!-- the green heart of the stone: the light that lives inside it -->
  <path fill="url(#rejCore)" d="M32 24L38 40L39 58L35 74L32 80L29 74L25 58L26 40Z"/>
  <!-- the narrow bright line in the middle -->
  <path fill="#EAFFD0" opacity="0.9" d="M32 38L34 50L34 62L32 72L30 62L30 50Z"/>

  <!-- the mark of the souls on the stone: the symbol of the credits, small
       and low on the shard, the way it is stamped on the stone of the game.
       The path is drawn around (32, 71), so it is moved there by hand. -->
  <g fill="#EAFFD0" opacity="0.9">
    <path d="M0 0c-1.6-1.3-6-4.4-6-8.2 0-2.4 1.8-4.2 4-4.2 1.1 0 2 .5 2.6 1.3.6-.8 1.5-1.3 2.6-1.3 2.2 0 4 1.8 4 4.2 0 3.8-4.4 6.9-6 8.2z" transform="translate(32,71) scale(0.5,0.5)"/>
  </g>
</svg>
