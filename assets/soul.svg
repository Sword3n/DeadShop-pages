<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="souls">
  <defs>
    <!-- the light of the soul: green in the middle, dark at the rim -->
    <radialGradient id="soulCore" cx="0.46" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#DFFFF0"/>
      <stop offset="0.22" stop-color="#8FF6C4"/>
      <stop offset="0.52" stop-color="#35D27A"/>
      <stop offset="0.82" stop-color="#149A52"/>
      <stop offset="1" stop-color="#0A5C30"/>
    </radialGradient>
    <!-- the light that hangs around it -->
    <radialGradient id="soulHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4BE08A" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#2FC46E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2FC46E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- the halo of light -->
  <circle cx="32" cy="30" r="30" fill="url(#soulHalo)"/>

  <!-- the dark rim of the soul. It follows the shape of the soul and is
       only a little wider than it, so the soul keeps its outline on a dark
       screen as well as on a light one. -->
  <path fill="#05090C" transform="translate(32 32) scale(1.16) translate(-32 -32)"
        d="M32 12c5 6 9 10 9 16 0 8-4 13-9 13s-9-5-9-13c0-3 1-5 2-7-1 4 1 6 3 7-1-5-1-10 4-16z"/>

  <!-- the green inside: the light of the soul, with the dark bite that
       makes it look like a flame and not a ball. The same shape is in
       assets/soul-mark.svg, the file the chip of the header paints as a
       silhouette. -->
  <path fill="url(#soulCore)" d="M32 12c5 6 9 10 9 16 0 8-4 13-9 13s-9-5-9-13c0-3 1-5 2-7-1 4 1 6 3 7-1-5-1-10 4-16z"/>
  <!-- the bright heart of it -->
  <path fill="#EAFFF2" opacity="0.92" d="M32 20c2 3 4 5 4 8 0 4-2 7-4 7s-4-3-4-7c0-3 2-5 4-8z"/>
  <!-- the notch on the side: the dark crescent of the game -->
  <path fill="#05090C" opacity="0.85" d="M41 22c1 2 1 4 1 6 0 5-2 9-5 11 4-1 6-5 6-10 0-3-1-5-2-7z"/>

  <!-- the sparks around it -->
  <g fill="#6FF0A8">
    <circle cx="15" cy="16" r="1.5" opacity="0.85"/>
    <circle cx="48" cy="14" r="1.2" opacity="0.7"/>
    <circle cx="52" cy="38" r="1.4" opacity="0.75"/>
    <circle cx="13" cy="42" r="1" opacity="0.55"/>
    <circle cx="30" cy="53" r="1.1" opacity="0.6"/>
    <circle cx="42" cy="55" r="0.9" opacity="0.45"/>
  </g>
</svg>
